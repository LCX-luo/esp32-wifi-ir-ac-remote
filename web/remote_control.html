<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>空调遥控器 · ESP32</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #ffffff 0%, #eaf4ff 100%);
    color: #1a2b3c; min-height: 100vh; display: flex; justify-content: center;
    padding: 20px 16px 40px;
  }
  .wrap { width: 100%; max-width: 420px; }

  .card {
    background: #ffffff; border: 1px solid #dbe9fb; border-radius: 16px;
    padding: 18px; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(43,127,255,0.06);
  }
  .card h2 { font-size: 13px; color: #5b7ca3; margin-bottom: 12px; font-weight: 600; }

  /* 顶部状态 */
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .status { display: flex; align-items: center; font-size: 13px; color: #5b7ca3; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #c5d5e8; margin-right: 6px; }
  .dot.on { background: #34c759; box-shadow: 0 0 6px #34c759; }
  .dot.err { background: #ff9500; }

  /* 电源按钮 */
  .power-box { text-align: center; padding: 22px 0 16px; }
  .power-btn {
    width: 130px; height: 130px; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(145deg, #eaf1fa, #d7e6f8);
    color: #8aa7c8; font-size: 15px; font-weight: 600;
    box-shadow: 6px 6px 14px rgba(43,127,255,0.12), -6px -6px 14px #ffffff;
    transition: all .2s; display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .power-btn .ico { font-size: 40px; line-height: 1.1; }
  .power-btn.on {
    background: linear-gradient(145deg, #2b7fff, #1f66e0); color: #fff;
    box-shadow: 0 10px 26px rgba(43,127,255,0.45);
  }
  .power-btn:active { transform: scale(0.95); }

  .temp-row { display: flex; align-items: center; justify-content: center; gap: 24px; margin: 6px 0 4px; }
  .temp-val { font-size: 44px; font-weight: 700; color: #1a3a5c; min-width: 96px; text-align: center; }
  .temp-val small { font-size: 18px; color: #8aa7c8; }
  .round {
    width: 42px; height: 42px; border-radius: 50%; border: none; cursor: pointer;
    background: #e8f1ff; color: #2b7fff; font-size: 22px; font-weight: 700;
  }
  .round:active { transform: scale(0.92); }

  .grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .grid button {
    flex: 1 1 30%; padding: 12px 0; font-size: 14px; border: 1px solid #dbe9fb;
    border-radius: 10px; background: #f6faff; color: #1a3a5c; cursor: pointer;
  }
  .grid button:active { background: #e0edff; }
  .grid button.sel { background: #2b7fff; color: #fff; border-color: #2b7fff; }

  #log {
    background: #f6faff; border: 1px solid #dbe9fb; border-radius: 10px;
    padding: 10px; height: 120px; overflow-y: auto; font-family: Consolas, monospace;
    font-size: 11px; color: #5b7ca3; white-space: pre-wrap; word-break: break-all;
  }
  details.collapse { font-size: 12px; color: #8aa7c8; }
  details.collapse summary { cursor: pointer; margin-bottom: 6px; }
  details.collapse label { display: block; margin-top: 8px; color: #8aa7c8; }
  details.collapse input {
    width: 100%; margin-top: 4px; padding: 8px 10px; font-size: 12px;
    border: 1px solid #dbe9fb; border-radius: 8px; background: #f6faff; color: #1a3a5c; outline: none;
  }
  details.collapse .reconnect { margin-top: 10px; padding: 8px 16px; font-size: 12px;
    border: none; border-radius: 8px; background: #e8f1ff; color: #2b7fff; cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="status"><span class="dot" id="dot"></span><span id="status-text">连接中...</span></div>
    <div class="status" id="dev-label" style="font-size:12px;color:#8aa7c8"></div>
  </div>

  <div class="card">
    <div class="power-box">
      <button class="power-btn" id="power-btn" onclick="togglePower()">
        <span class="ico">⏻</span><span id="power-text">关机</span>
      </button>
    </div>
  </div>

  <div class="card">
    <h2>温度</h2>
    <div class="temp-row">
      <button class="round" onclick="tempStep(-1)">−</button>
      <div class="temp-val"><span id="temp-val">26</span><small>°C</small></div>
      <button class="round" onclick="tempStep(1)">+</button>
    </div>
  </div>

  <div class="card">
    <h2>模式</h2>
    <div class="grid" id="mode-grid">
      <button data-v="auto">自动</button>
      <button data-v="cool">制冷</button>
      <button data-v="heat">制热</button>
      <button data-v="dry">除湿</button>
      <button data-v="fan">送风</button>
    </div>
  </div>

  <div class="card">
    <h2>风速</h2>
    <div class="grid" id="fan-grid">
      <button data-v="auto">自动</button>
      <button data-v="low">低</button>
      <button data-v="mid">中</button>
      <button data-v="high">高</button>
    </div>
  </div>

  <details class="collapse">
    <summary>高级设置</summary>
    <label>设备 ID</label>
    <input type="text" id="device" value="e9a8e8">
    <label>Broker (WebSocket)</label>
    <input type="text" id="broker" value="wss://broker.emqx.io:8084/mqtt">
    <label>主题前缀</label>
    <input type="text" id="prefix" value="/ac-remote">
    <button class="reconnect" onclick="connectBroker()">重新连接</button>
  </details>

  <details class="collapse">
    <summary>通信日志</summary>
    <div id="log">连接中...</div>
  </details>

</div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js"></script>
<script>
const DEFAULT_BROKER = 'wss://broker.emqx.io:8084/mqtt';
const DEFAULT_PREFIX = '/ac-remote';
const DEFAULT_DEVICE = 'e9a8e8';   /* 本机 ESP32 设备 ID（MAC 后 3 字节） */

let client = null;
let connected = false;
let powerOn = false;
let temp = 26;
let s_devId = DEFAULT_DEVICE;
const MIN_T = 16, MAX_T = 30;
const $ = id => document.getElementById(id);

/* ================= MQTT 连接 ================= */
function connectBroker() {
  if (client) { try { client.end(true); } catch (e) {} client = null; }
  connected = false;

  const broker = $('broker').value.trim() || DEFAULT_BROKER;
  const prefix = $('prefix').value.trim() || DEFAULT_PREFIX;
  s_devId = ($('device').value.trim() || DEFAULT_DEVICE).toLowerCase();
  $('dev-label').textContent = '设备 ' + s_devId;

  const clientId = 'web_' + Math.random().toString(16).slice(2, 10);
  try {
    client = mqtt.connect(broker, { clientId, connectTimeout: 8000, reconnectPeriod: 3000 });
  } catch (e) { log('连接异常: ' + e.message); setDot('err', '连接失败'); return; }

  client.on('connect', () => {
    connected = true;
    setDot('on', '已连接');
    client.subscribe(`${prefix}/${s_devId}/status`, { qos: 1 });
    log('已连接 ' + broker);
  });
  client.on('message', (topic, payload) => {
    log('状态 ← ' + payload.toString());
    try {
      const j = JSON.parse(payload.toString());
      if (j && j.state === 'online') setDot('on', '设备在线');
    } catch (e) {}
  });
  client.on('close', () => { connected = false; setDot('', '连接断开'); });
  client.on('error', e => { log('错误: ' + e.message); setDot('err', '连接失败'); });

  setDot('', '连接中...');
}

/* ================= 发送命令 ================= */
function publish(msg) {
  if (!connected) { log('未连接，无法发送'); return; }
  const prefix = $('prefix').value.trim() || DEFAULT_PREFIX;
  client.publish(`${prefix}/${s_devId}/cmd`, JSON.stringify(msg), { qos: 1 });
  log('发送 → ' + JSON.stringify(msg));
}

/* ================= 电源 ================= */
function togglePower() {
  powerOn = !powerOn;
  $('power-btn').className = 'power-btn' + (powerOn ? ' on' : '');
  $('power-text').textContent = powerOn ? '开机' : '关机';
  publish({ cmd: powerOn ? 'on' : 'off' });
}

/* ================= 温度 ================= */
function tempStep(d) {
  temp = Math.min(MAX_T, Math.max(MIN_T, temp + d));
  $('temp-val').textContent = temp;
  publish({ cmd: 'temp', temp: temp });
}

/* ================= 模式 / 风速 ================= */
document.querySelectorAll('#mode-grid button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#mode-grid button').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel');
    publish({ cmd: 'mode', mode: b.dataset.v });
  });
});
document.querySelectorAll('#fan-grid button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('#fan-grid button').forEach(x => x.classList.remove('sel'));
    b.classList.add('sel');
    publish({ cmd: 'fan', fan: b.dataset.v });
  });
});

/* ================= 日志 ================= */
function log(msg) {
  const el = $('log');
  if (!el) return;
  const t = new Date().toTimeString().slice(0, 8);
  el.textContent += `[${t}] ${msg}\n`;
  el.scrollTop = el.scrollHeight;
}
function setDot(state, text) {
  $('dot').className = 'dot' + (state ? ' ' + state : '');
  $('status-text').textContent = text;
}

/* 打开页面即自动连接 */
window.addEventListener('load', connectBroker);
</script>
</body>
</html>
